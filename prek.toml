#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "frontend-build"
name = "frontend build"
entry = "npm --prefix frontend run build"
language = "system"
pass_filenames = false
always_run = true
priority = 10
stages = ["pre-commit", "pre-push"]

[[repos.hooks]]
id = "frontend-test"
name = "frontend test"
entry = "npm --prefix frontend test"
language = "system"
pass_filenames = false
always_run = true
priority = 20
stages = ["pre-commit", "pre-push"]

[[repos.hooks]]
id = "backend-test"
name = "backend test"
entry = "cargo test --manifest-path backend/Cargo.toml --locked"
language = "system"
pass_filenames = false
always_run = true
priority = 30
stages = ["pre-push"]

[[repos.hooks]]
id = "docker-compose-up-check"
name = "docker compose up check"
entry = "bash scripts/prek-compose-up-check.sh"
language = "system"
pass_filenames = false
always_run = true
priority = 40
stages = ["manual"]
