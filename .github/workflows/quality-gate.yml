name: Prek Quality Gate

on:
  workflow_call:
    inputs:
      upload_frontend_dist:
        description: Upload the verified frontend build for downstream packaging
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Pre-push Stage
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set Up Rust
        run: rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-
            ${{ runner.os }}-cargo-

      - name: Set Up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Prek Pre-push Stage
        env:
          PREK_VERSION: 0.3.9
        run: bash scripts/run-prek-checks.sh pre-push

      - name: Upload Verified Frontend Build
        if: ${{ inputs.upload_frontend_dist }}
        uses: actions/upload-artifact@v7
        with:
          name: release-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
