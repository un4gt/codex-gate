name: Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Gate
    uses: ./.github/workflows/quality-gate.yml
    with:
      upload_frontend_dist: true

  binary:
    name: Build Binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            exe_suffix: ''
            archive_ext: tar.gz
          - os: windows-latest
            target: windows-x86_64
            exe_suffix: .exe
            archive_ext: zip

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Download Verified Frontend Build
        uses: actions/download-artifact@v8
        with:
          name: release-frontend-dist
          path: frontend/dist

      - name: Set Up Rust
        run: rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Backend
        env:
          LITTLE_GATE_VERSION: ${{ github.ref_name }}
          LITTLE_GATE_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --manifest-path backend/Cargo.toml

      - name: Prepare Package Name
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          package_name="little-gate-${version}-${{ matrix.target }}"
          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"

      - name: Assemble Package
        shell: bash
        run: |
          set -euo pipefail
          package="dist/${{ steps.package.outputs.name }}"
          mkdir -p "${package}/static"
          cp "backend/target/release/backend${{ matrix.exe_suffix }}" "${package}/little-gate${{ matrix.exe_suffix }}"
          cp -R frontend/dist/* "${package}/static/"
          cp deploy/binary.env.example "${package}/.env.example"
          cp docs/binary-deployment.md "${package}/README.binary.md"
          cp LICENSE "${package}/LICENSE"

          if [[ "${{ matrix.target }}" == linux-* ]]; then
            cp deploy/linux/run-little-gate.sh "${package}/run-little-gate.sh"
            cp deploy/systemd/little-gate.service "${package}/little-gate.service"
            chmod +x "${package}/little-gate" "${package}/run-little-gate.sh"
          else
            cp deploy/windows/run-little-gate.ps1 "${package}/run-little-gate.ps1"
          fi

      - name: Archive Linux Package
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: tar -C dist -czf "dist/${{ steps.package.outputs.name }}.tar.gz" "${{ steps.package.outputs.name }}"

      - name: Archive Windows Package
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ steps.package.outputs.name }}" -DestinationPath "dist/${{ steps.package.outputs.name }}.zip"

      - name: Upload Binary Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  docker:
    name: Build And Publish Docker Image
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log In To GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log In To Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Image Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Codex Gate container image
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Binary Packages
        uses: actions/download-artifact@v8
        with:
          pattern: little-gate-*
          path: dist

      - name: Publish Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release assets found" >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Linux and Windows binary packages for ${GITHUB_REF_NAME}."
          fi
